services:
  mongo:
    image: mongo:7
    container_name: wb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: wb-server
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/whiteboard
      # Redis is optional: leave REDIS_URL empty to use the in-memory fallback
      # (single-process fan-out + refresh-token store). Set it to a real Redis
      # (e.g. redis://redis:6379) when scaling to multiple server instances.
      REDIS_URL: ""
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: wb-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
